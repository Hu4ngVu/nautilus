networks:
  nautilus:

services:
  mysql:
    image: mysql:8.4.13
    container_name: mysql
    networks:
        - nautilus
    environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
        MYSQL_DATABASE: nautilus
    healthcheck:
      test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_PASSWORD' ]
      timeout: 20s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
  migrate:
    depends_on:
      mysql:
        condition: service_healthy
    image: openfga/openfga:latest
    container_name: migrate
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=mysql
      - OPENFGA_DATASTORE_URI=root:${MYSQL_PASSWORD}@tcp(mysql:3306)/nautilus?parseTime=true
    networks:
      - nautilus
  openfga:
    depends_on:
      migrate:
        condition: service_completed_successfully
    image: openfga/openfga:latest
    container_name: openfga
    environment:
      - OPENFGA_DATASTORE_ENGINE=mysql
      - OPENFGA_DATASTORE_URI=root:${MYSQL_PASSWORD}@tcp(mysql:3306)/nautilus?parseTime=true
      - OPENFGA_LOG_FORMAT=json
    ports:
      - "8080:8080"
    command: run
    networks:
      - nautilus
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 10s
      timeout: 5s
      retries: 3
  redis:
    image: redis:8.8.4
    container_name: redis
    networks:
      - nautilus
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  nautilus:
    depends_on:
      redis:
        condition: service_healthy
      openfga:
        condition: service_healthy
    build: ./nautilus-server
    image: nautilus/nautilus-server:latest
    container_name: nautilus
    networks:
      - nautilus
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - WEBHOOK_SECRET_KEY=${WEBHOOK_SECRET_KEY}
      - MYSQL_URL=jdbc:mysql://mysql:3306/nautilus
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
      - OPENFGA_API_URL=http://openfga:8080
      - OPENFGA_STORE_ID=${OPENFGA_STORE_ID}
      - OPENFGA_AUTHORIZATION_MODEL_ID=${OPENFGA_AUTHORIZATION_MODEL_ID}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Behind the client proxy: build OAuth redirect URIs from X-Forwarded-* headers
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
    ports:
      - "3279:3279"
  client:
    depends_on:
      - nautilus
    build: ./nautilus-client
    image: nautilus/nautilus-client:latest
    container_name: nautilus-client
    networks:
      - nautilus
    ports:
      - "80:80"
volumes:
    mysql_data: