name: Backend CI
on:
  push:
    paths:
      - 'nautilus-server/**'
    branches:
      - develop
  pull_request:
    types: [ opened, reopened ]
    paths:
      - 'nautilus-server/**'
    branches:
      - develop
jobs:
  run-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Run test
        run: ./gradlew test
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build project
        run: ./gradlew build
      - name: Change directory
        run: cd ..
      - name: Build docker image
        run: docker build -t nautilus-server:latest .
      - name: Upload docker image to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nautilus-server:latest