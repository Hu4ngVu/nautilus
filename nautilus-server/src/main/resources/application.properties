spring.application.name=nautilus-server

# App config
app.jwt.secret=${JWT_SECRET}
# 15 minutes
app.jwt.expiration-ms=900000
# 30 days
app.jwt.refresh-expiration-ms=2592000000
app.s3.bucket-name={AWS_S3_BUCKET_NAME}
app.webhook.secret-key=${WEBHOOK_SECRET_KEY}

# MySQL config
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:20}
spring.jpa.open-in-view=false

# Redis config
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.database=0

# Spring config
spring.threads.virtual.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=5MB

# OAuth config
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Object storage config (s3)
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
spring.cloud.aws.region.static = "auto"
spring.cloud.aws.s3.endpoint=${AWS_S3_ENDPOINT}

# Quartz config
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.isClustered=true

# OpenFGA config
openfga.api-url=${OPENFGA_API_URL}
openfga.store-id=${OPENFGA_STORE_ID}
openfga.authorization-model-id=${OPENFGA_AUTHORIZATION_MODEL_ID}
openfga.credentials.method=api_token
openfga.credentials.config.api-token=${OPENFGA_API_TOKEN}