spring.jpa.hibernate.ddl-auto=create-drop

spring.quartz.job-store-type=memory
spring.quartz.jdbc.initialize-schema=never
spring.autoconfigure.exclude=org.springframework.boot.quartz.autoconfigure.QuartzAutoConfiguration

app.jwt.secret=nautilus-test-secret-key-long-enough-for-hs256
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000
app.s3.bucket-name=nautilus-test-bucket
app.s3.public-url=https://cdn.example.test
app.webhook.secret-key=nautilus-test-webhook-secret

spring.cloud.aws.credentials.access-key=test-access-key
spring.cloud.aws.credentials.secret-key=test-secret-key
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.s3.endpoint=http://localhost:9000

openfga.credentials.method=none
openfga.store-id=test-store
openfga.authorization-model-id=test-model
